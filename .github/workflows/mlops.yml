name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          CREDS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python -c '
          import os, json
          creds = os.environ.get("CREDS", "").strip()
          try:
              data = json.loads(creds)
              if "type" in data and data["type"] == "service_account":
                  with open("/tmp/sa-key.json", "w") as f:
                      json.dump(data, f)
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
              elif "aws_access_key_id" in data:
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"AWS_ACCESS_KEY_ID={data.get(\"aws_access_key_id\")}\n")
                      f.write(f"AWS_SECRET_ACCESS_KEY={data.get(\"aws_secret_access_key\")}\n")
                      if "aws_default_region" in data:
                          f.write(f"AWS_DEFAULT_REGION={data.get(\"aws_default_region\")}\n")
          except Exception:
              with open("/tmp/sa-key.json", "w") as f:
                  f.write(creds)
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
          '

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          bucket_name = os.environ["CLOUD_BUCKET"]
          model_path = "models/model.pkl"
          dest_key = "models/latest/model.pkl"

          if os.environ.get("AWS_ACCESS_KEY_ID"):
              import boto3
              s3 = boto3.client("s3")
              s3.upload_file(model_path, bucket_name, dest_key)
              print(f"Uploaded {model_path} to s3://{bucket_name}/{dest_key}")
          else:
              from google.cloud import storage
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob(dest_key)
              blob.upload_from_filename(model_path)
              print(f"Uploaded {model_path} to gs://{bucket_name}/{dest_key}")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          threshold = 0.65
          if acc < threshold:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < {threshold}. Huy deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= {threshold}. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1

